name: E-Commerce Data Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # We need specific permissions to allow the GitHub Action to push code back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.1 pytest==8.1.1
          
      - name: Generate Raw Data
        run: python scripts/generate_fake_events.py --count 25
        
      - name: Run Bronze Layer
        run: spark-submit scripts/spark/bronze_events.py

      - name: Run Silver Layer
        run: spark-submit scripts/spark/silver_events.py

      - name: Run Gold Layer
        run: spark-submit scripts/spark/gold_metrics.py
        
      - name: Run Tests (Pytest)
        run: python -m pytest tests/
        
      - name: Commit and Push Generated Data Back to Repo
        run: |
          # Set up the git user for the commit
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage the 'data' directory (overwriting any previous versions)
          git add data/
          
          # Only commit and push if there are actually changes to the data
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update pipeline data [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi

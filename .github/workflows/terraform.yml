name: Terraform Scaffold

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Run terraform apply to refresh generated deployment artifacts"
        required: false
        type: boolean
        default: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply_changes
        run: terraform apply -input=false -auto-approve

      - name: Upload generated deployment artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.apply_changes
        uses: actions/upload-artifact@v4
        with:
          name: terraform-generated-${{ github.run_id }}
          path: terraform/generated
